# ============================================
# NEXORA - Complete Configuration File
# Version: 1.0.0
# ============================================

# System Configuration
system:
  name: "Nexora"
  environment: "production"  # development | staging | production
  timezone: "Asia/Kolkata"
  base_url: "https://nexora.yourdomain.com"
  api_url: "https://api.nexora.yourdomain.com"
  frontend_url: "https://nexora.yourdomain.com"

# Server Configuration
server:
  host: "0.0.0.0"
  port: 8080
  websocket_port: 8080
  grpc_port: 50051
  shutdown_timeout: 30
  
  # Default check settings
  default_interval: 60
  default_timeout: 10
  default_retries: 3
  
  # Auto-discovery
  auto_discovery: true
  discovery_interval: 3600
  discovery_network: "192.168.1.0/24"

# Database Configuration
database:
  type: "postgresql"
  host: "postgres"
  port: 5432
  name: "nexora"
  username: "postgres"
  password: "${DB_PASSWORD}"
  ssl_mode: "disable"
  max_connections: 20
  connection_timeout: 30
  pool_size: 10

# Redis Configuration
redis:
  host: "redis"
  port: 6379
  password: "${REDIS_PASSWORD}"
  database: 0
  max_retries: 3
  retry_delay: 1000

# Time-series Database (InfluxDB)
timeseries:
  enabled: false
  type: "influxdb"
  host: "influxdb"
  port: 8086
  organization: "nexora"
  bucket: "metrics"
  token: "${INFLUX_TOKEN}"
  retention_days: 90

# JWT Authentication
jwt:
  secret: "${JWT_SECRET}"
  expires_in: "7d"
  refresh_expires_in: "30d"
  algorithm: "HS256"

# Security
security:
  # Password Policy
  password_policy:
    min_length: 8
    require_uppercase: true
    require_lowercase: true
    require_numbers: true
    require_special: true
    expire_days: 90
  
  # Session
  session_timeout: 86400  # 24 hours
  max_login_attempts: 5
  lockout_duration: 900  # 15 minutes
  
  # MFA
  mfa_enabled: true
  mfa_issuer: "Nexora"
  mfa_algorithm: "SHA1"
  mfa_digits: 6
  mfa_period: 30
  
  # SSL/TLS
  ssl_enabled: true
  ssl_cert_path: "/certs/server.crt"
  ssl_key_path: "/certs/server.key"
  ssl_min_version: "TLSv1.2"
  ssl_ciphers: "HIGH:!aNULL:!MD5"

# Monitoring Configuration
monitoring:
  # Check Types
  checks:
    http:
      enabled: true
      method: "GET"
      expected_status: 200
      follow_redirects: true
      verify_ssl: true
    
    https:
      enabled: true
      method: "GET"
      expected_status: 200
      follow_redirects: true
      verify_ssl: true
    
    ping:
      enabled: true
      packet_count: 4
      packet_size: 56
    
    tcp:
      enabled: true
      timeout: 10
    
    dns:
      enabled: true
      record_type: "A"
      timeout: 5
  
  # SSL Monitoring
  ssl:
    enabled: true
    warn_days: 7
    critical_days: 3
    check_ports:
      - 443
      - 8443
      - 465
      - 993
  
  # Templates
  templates:
    production:
      interval: 60
      timeout: 10
      checks:
        - http
        - ping
        - ssl
      alert_rules:
        - critical_http_down
        - warning_http_slow
        - critical_ssl_expiry
    
    database:
      interval: 30
      timeout: 15
      checks:
        - tcp
        - ping
      alert_rules:
        - critical_db_down
        - warning_db_latency

# Alerting Configuration
alerting:
  # Alert Rules
  rules:
    critical_http_down:
      severity: "critical"
      condition: "status != 200"
      occurrences: 3
      time_window: 60
      actions: ["pagerduty", "slack", "email"]
    
    warning_http_slow:
      severity: "warning"
      condition: "response_time > 2000"
      occurrences: 2
      time_window: 120
      actions: ["slack", "email"]
    
    critical_ssl_expiry:
      severity: "critical"
      condition: "ssl_days_left < 3"
      occurrences: 1
      actions: ["slack", "email"]
    
    critical_cpu_high:
      severity: "critical"
      condition: "cpu > 95"
      occurrences: 5
      time_window: 300
      actions: ["slack", "email"]
    
    warning_cpu_high:
      severity: "warning"
      condition: "cpu > 80"
      occurrences: 10
      time_window: 600
      actions: ["slack"]
  
  # Escalation Policies
  escalation:
    levels:
      - time: 0
        actions: ["slack", "email"]
      - time: 300
        actions: ["pagerduty"]
      - time: 900
        actions: ["sms"]
      - time: 1800
        actions: ["phone"]
    max_attempts: 5
  
  # Suppression
  suppression:
    deduplicate: true
    dedup_window: 3600
    flapping_detection: true
    flapping_window: 300
    flapping_threshold: 3
    recovery_confirms: 3

# Scanner Configuration
scanner:
  enabled: true
  
  # Scan Types
  types:
    network:
      enabled: true
      ports: "1-10000"
      os_detection: true
      service_version: true
    
    web:
      enabled: true
      sql_injection: true
      xss: true
      path_traversal: true
      ssl_check: true
    
    compliance:
      enabled: true
      standards:
        - pci_dss
        - hipaa
        - gdpr
        - cis
  
  # CVE Sources
  cve_sources:
    - nvd: "https://nvd.nist.gov/feeds/json/cve/1.1/"
    - exploitdb: "https://exploit-db.com/rss"
  
  # Risk Scoring
  risk_scoring:
    weights:
      critical: 9.0
      high: 7.0
      medium: 4.0
      low: 2.0
    exploit_weight: 1.2
    internet_facing_weight: 1.15
    criticality_weights:
      production: 1.3
      staging: 1.0
      development: 0.7

# Integrations
integrations:
  slack:
    enabled: false
    webhook_url: "${SLACK_WEBHOOK}"
    channel: "#alerts"
    send_critical: true
    send_warning: true
    send_recovery: true
  
  email:
    enabled: false
    host: "smtp.gmail.com"
    port: 587
    username: "${EMAIL_USER}"
    password: "${EMAIL_PASS}"
    from_email: "alerts@nexora.com"
    use_tls: true
    use_starttls: true
  
  telegram:
    enabled: false
    bot_token: "${TELEGRAM_BOT_TOKEN}"
    chat_id: "${TELEGRAM_CHAT_ID}"
    send_critical: true
  
  pagerduty:
    enabled: false
    service_key: "${PAGERDUTY_SERVICE_KEY}"
    send_critical: true
    auto_resolve: true
  
  jira:
    enabled: false
    url: "${JIRA_URL}"
    project_key: "${JIRA_PROJECT_KEY}"
    username: "${JIRA_USERNAME}"
    api_token: "${JIRA_API_TOKEN}"
    create_for_critical: true
    create_for_high: true

# Logging
logging:
  level: "info"  # debug | info | warn | error
  format: "json"  # json | text
  output:
    - type: "file"
      path: "/var/log/nexora/app.log"
      rotation: "daily"
      max_size: "100MB"
      max_files: 30
    - type: "stdout"
  
  audit:
    enabled: true
    retention_days: 365
    log_changes: true
    log_actions: true
    log_api_calls: true

# Performance
performance:
  workers: 10
  max_concurrent_checks: 100
  batch_processing: true
  batch_size: 50
  metric_cache_ttl: 60
  
  # Rate Limiting
  rate_limit:
    enabled: true
    requests_per_minute: 60
    burst: 20

# Backup
backup:
  enabled: true
  path: "/backups/nexora"
  schedule: "daily"
  time: "01:00"
  retention_days: 30
  components:
    - database
    - configurations
    - metrics
  compression: "gzip"
  encryption: true
  encryption_key: "${BACKUP_KEY}"